<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>NOTA prototype B: noise to name</title><link rel="stylesheet" href="../shared.css">
<style>
body{background:#111110}
.run{height:360svh;position:relative}
.pin{position:sticky;top:0;height:100svh;overflow:hidden;display:grid;grid-template-columns:1.1fr .9fr;align-items:center;gap:clamp(16px,4vw,60px);padding:70px clamp(20px,5vw,80px) 40px;max-width:1500px;margin:auto}
.bgfx{position:fixed;inset:0;z-index:-1}
.noise{position:absolute;inset:0;pointer-events:none}
.n{position:absolute;left:0;top:0;font:italic 400 clamp(20px,3.2vw,44px)/1 var(--serif);white-space:nowrap;will-change:transform,opacity,filter}
h1{font:400 clamp(38px,min(6.2vw,11svh),104px)/1.02 var(--serif);position:relative;z-index:2;letter-spacing:-.01em}
h1 .w{display:inline-block;will-change:transform,filter,opacity;margin-right:.22em}
h1 .u{position:relative;display:inline-block}
h1 .u svg{position:absolute;left:-6%;top:-10%;width:112%;height:122%;overflow:visible}
h1 .u path{fill:none;stroke:var(--acc);stroke-width:5;stroke-linecap:round;vector-effect:non-scaling-stroke}
.sub{margin-top:18px;font-size:clamp(17px,1.5vw,22px);max-width:26em;opacity:0}
.cta-row{margin-top:24px;opacity:0;pointer-events:none}.cta-row.on{pointer-events:auto}
.card{position:relative;justify-self:center;width:min(100%,400px);aspect-ratio:910/1287;will-change:transform,opacity;opacity:0}
.card img{width:100%;height:100%;border-radius:10px;box-shadow:0 40px 80px -30px rgba(0,0,0,.6)}
.card small{position:absolute;left:0;right:0;bottom:-26px;font:11px ui-monospace,monospace;color:#8c8c85;text-align:center}
.scroll{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);font:12px ui-monospace,monospace;letter-spacing:.14em;color:#8c8c85;text-transform:uppercase;z-index:9;transition:opacity .4s}
.scroll i{display:block;width:1px;height:28px;background:currentColor;margin:8px auto 0;animation:dr 1.6s infinite}@keyframes dr{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
.tag{color:#8c8c85}
@media(max-width:860px){.pin{grid-template-columns:1fr;align-content:center;gap:34px;padding-top:64px}.card{width:min(62%,250px);order:2;max-height:34svh;aspect-ratio:auto;height:34svh;width:auto;justify-self:center}.card img{width:auto;height:100%}h1{font-size:clamp(36px,10.4vw,60px)}}
@media(prefers-reduced-motion:reduce){.scroll i{animation:none}}
</style></head><body>
<a class="mini" href="#"><img id="lg" src="../assets/nota-logo.png" alt="NOTA" width="560" height="317" style="filter:brightness(0) invert(1)"></a>
<div class="run" id="run"><div class="pin" id="pin">
<div class="noise" id="noise" aria-hidden="true"></div>
<div>
<h1 id="h" aria-label="A good welcome should not end at the door."></h1>
<p class="sub" id="sub">Your customers already said it. We write it down, name it, and make it into one page.</p>
<div class="cta-row" id="ctar"><a class="cta" href="mailto:iahmadghazii@gmail.com?subject=Blueprint">Reply "Blueprint" &rarr;</a></div>
</div>
<div class="card" id="card"><img src="../assets/blueprint-1.webp" alt="Sample NOTA blueprint page" width="910" height="1287"><small>Sample page. Illustrative, not a client.</small></div>
</div></div>
<div class="scroll" id="sc">Scroll<i></i></div>
<p class="tag">NOTA prototype B. Sample lines, illustrative.</p>
<script>
const $=s=>document.querySelector(s),h=$('#h'),run=$('#run'),noise=$('#noise'),card=$('#card'),sub=$('#sub'),ctar=$('#ctar');
const text="A good welcome should not end at the door.";
const words=text.split(' ');
h.innerHTML=words.map((w,i)=>w==='welcome'?`<span class="w u" data-i="${i}">welcome<svg viewBox="0 0 300 100" preserveAspectRatio="none" aria-hidden="true"><path pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" d="M20 62 C 10 20 120 6 170 8 C 260 10 296 34 280 62 C 266 90 160 98 100 94 C 40 90 8 78 14 52"/></svg></span>`:`<span class="w" data-i="${i}">${w}</span>`).join('');
const ws=[...h.querySelectorAll('.w')];
const phr=["so friendly","worth the wait","she remembered me","made by hand","open late","best in town","feels like home","never rushed","real people","lovely little place","we will be back","small and careful","that smell","you can tell","just right"];
const ns=phr.map((p,i)=>{const e=document.createElement('span');e.className='n';e.textContent=p;noise.appendChild(e);return e});
const rnd=(a,b,s)=>{const x=Math.sin(s*127.1+a*311.7)*43758.5;return b*(x-Math.floor(x))};
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),ease=t=>1-Math.pow(1-cl(t),3),mix=(a,b,t)=>a+(b-a)*t;
const rm=matchMedia('(prefers-reduced-motion: reduce)').matches;
let W,H;function size(){W=innerWidth;H=innerHeight}size();addEventListener('resize',()=>{size();draw()});
const hex=(c)=>c.map(v=>Math.round(v)).join(',');
function draw(){
  W=innerWidth;H=innerHeight;
  const r=run.getBoundingClientRect(),p=rm?1:cl(-r.top/(r.height-H));
  // background: dark -> paper
  const tb=ease(cl((p-.45)/.2));
  document.body.style.background=`rgb(${hex([mix(17,251,tb),mix(17,251,tb),mix(16,249,tb)])})`;
  const ink=`rgb(${hex([mix(246,17,tb),mix(246,17,tb),mix(240,16,tb)])})`;
  h.style.color=ink;sub.style.color=ink;$('#lg').style.filter=tb>.5?'none':'brightness(0) invert(1)';
  // noise: scatter -> pulled toward the headline -> gone
  ns.forEach((e,i)=>{
    const x0=rnd(i,W*.9,1)+W*.02,y0=rnd(i,H*.85,2)+H*.06,rot=rnd(i,30,3)-15;
    const tt=ease(cl((p-.04-i*.012)/.42)); const cx=W*.3,cy=H*.46;
    const drift=rm?0:Math.sin(performance.now()/1400+i)*10;
    const x=mix(x0,cx,tt),y=mix(y0,cy,tt)+drift;
    e.style.transform=`translate(${x}px,${y}px) rotate(${rot*(1-tt)}deg) scale(${mix(1,.4,tt)})`;
    e.style.opacity=(cl(1-(tt-.6)/.4)*(.35+.4*rnd(i,1,4)))*(1-tb);
    e.style.color=`rgb(${hex([mix(246,17,tb),mix(246,17,tb),mix(240,16,tb)])})`;
    e.style.filter=`blur(${mix(rnd(i,3,5),0,Math.min(1,tt*2))}px)`;
  });
  // words fly in
  ws.forEach((e,i)=>{
    const t=ease(cl((p-.12-i*.035)/.3));
    const dx=(rnd(i,1,6)-.5)*W*.9,dy=(rnd(i,1,7)-.5)*H*.8,rot=(rnd(i,1,8)-.5)*70;
    e.style.transform=`translate(${dx*(1-t)}px,${dy*(1-t)}px) rotate(${rot*(1-t)}deg) scale(${mix(1.6,1,t)})`;
    e.style.opacity=cl(t*1.6);e.style.filter=`blur(${(1-t)*8}px)`;
  });
  const pa=h.querySelector('.u path');pa.style.strokeDashoffset=1-ease(cl((p-.62)/.14));
  sub.style.opacity=ease(cl((p-.7)/.1));ctar.style.opacity=ease(cl((p-.86)/.1));ctar.classList.toggle('on',p>.9);
  const tc=ease(cl((p-.74)/.2));
  card.style.opacity=tc;card.style.transform=`translateY(${(1-tc)*H*.5}px) rotate(${(1-tc)*8-1.5*tc}deg) scale(${mix(.88,1,tc)})`;
  $('#sc').style.opacity=1-cl(p*8);
}
let tk=0;addEventListener('scroll',()=>{if(!tk)tk=requestAnimationFrame(()=>{tk=0;draw()})},{passive:true});
(function loop(){if(!rm){const r=run.getBoundingClientRect();if(r.top<=0&&r.bottom>0)draw()}requestAnimationFrame(loop)})();
draw();
</script></body></html>
