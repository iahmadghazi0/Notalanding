<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NOTA Lab</title>
<link rel="stylesheet" href="shared.css">
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#fafaf7;color:#111}
body{display:flex;flex-direction:column;font-family:Bric,system-ui,sans-serif}
.bar{display:flex;align-items:center;gap:10px;padding:max(8px,env(safe-area-inset-top)) 12px 8px;border-bottom:1px solid #e4e4de;background:#fafaf7}
.bar img{height:26px;width:auto;flex:none}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:1px solid #d6d6ce;background:#fff;color:#111;border-radius:99px;padding:9px 14px;font:600 14px Bric,system-ui,sans-serif;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected=true]{background:#111;color:#fff;border-color:#111}
.tabs button b{font-weight:700;margin-right:6px;opacity:.55}
.open{flex:none;font:500 12px/1 Bric,system-ui,sans-serif;color:#55554f;text-decoration:underline;padding:8px 2px}
iframe{flex:1;width:100%;border:0;background:#fff;display:block}
</style></head><body>
<div class="bar">
<img src="assets/nota-logo.png" alt="NOTA" width="560" height="317">
<nav class="tabs" id="tabs" role="tablist" aria-label="Lab prototypes"></nav>
<a class="open" id="open" href="a/" target="_blank" rel="noopener">Open alone</a>
</div>
<iframe id="f" title="Prototype" src="about:blank"></iframe>
<noscript><p style="padding:20px"><a href="a/">A. Say one word</a> · <a href="b/">B. Noise to name</a> · <a href="c/">C. Brush it in</a></p></noscript>
<script>
// To add a tab later: add one line here and upload a folder with an index.html next to this file.
const TABS=[
 {id:'a',label:'Say one word',path:'a/'},
 {id:'b',label:'Noise to name',path:'b/'},
 {id:'c',label:'Brush it in',path:'c/'}
];
const nav=document.getElementById('tabs'),f=document.getElementById('f'),op=document.getElementById('open');
TABS.forEach(t=>{const b=document.createElement('button');b.type='button';b.role='tab';b.dataset.id=t.id;b.innerHTML='<b>'+t.id.toUpperCase()+'</b>'+t.label;b.onclick=()=>go(t.id);nav.appendChild(b)});
function go(id){const t=TABS.find(x=>x.id===id)||TABS[0];[...nav.children].forEach(b=>b.setAttribute('aria-selected',b.dataset.id===t.id));
 if(f.getAttribute('data-id')!==t.id){f.setAttribute('data-id',t.id);f.src=t.path}
 op.href=t.path;if(location.hash!=='#'+t.id)history.replaceState(null,'','#'+t.id)}
addEventListener('hashchange',()=>go(location.hash.slice(1)));
go(location.hash.slice(1));
</script></body></html>
